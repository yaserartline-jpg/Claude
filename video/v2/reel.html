<!doctype html>
<html><head><meta charset="utf-8">
<title>Artline reel v3</title>
<style>
@font-face { font-family: Barlow; font-weight: 700; src: url(../fonts/BarlowCondensed-Bold.ttf); }
@font-face { font-family: Barlow; font-weight: 600; src: url(../fonts/BarlowCondensed-SemiBold.ttf); }
@font-face { font-family: Plex; font-weight: 500; src: url(../fonts/IBMPlexMono-Medium.ttf); }
@font-face { font-family: Sans; font-weight: 400; src: url("../fonts/SourceSans3[wght].ttf"); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* "Every space starts as a line" — Artline reel, 31.5 s @ 30 fps on a 120 BPM grid (1 beat = 15 frames).
   The floor plan IS the logo geometry: lines draw a plan, the plan tightens into the logo.
   Projects run as a full-width film strip with whip transitions. draw(f) is deterministic; render.mjs encodes.
   Palette: #000 #FFF #4D4D4D #808080 #D9D9D9 #800000. */
const CONFIG = {
  categories: [ // name, layout, tiles: [asset, project label]
    ["RETAIL & F&B", "mosaic4", [["ikea", "IKEA"], ["du", "du"], ["eyewa", "EYEWA"], ["mcd", "McDONALD'S"]]],
    ["HEALTHCARE", "hero3", [["banobagi", "BANOBAGI CLINIC"], ["drb", "DOCTOR B DENTAL"], ["ibnsina", "IBN SINA PHARMACY"]]],
    ["GOVERNMENT", "bands2", [["tawjeeh", "TAWJEEH CENTRE"], ["tasheel", "TASHEEL CENTRE"]]],
    ["LEISURE", "cols3", [["sparkys", "SPARKYS LAND"], ["gs", "911 GAMES STATION"], ["fadv", "FUJAIRAH ADVENTURES"]]],
    ["RESIDENTIAL & MARINE", "offset2", [["lanai", "LANAI ISLAND · RENDER"], ["jubail", "JUBAIL ISLAND · RENDER"]]],
  ],
  stats: [["15+", "YEARS OF FIT-OUT & CONSTRUCTION"], ["50", "PROJECTS DELIVERED SINCE 2021"], ["33", "GOVERNMENT & CORPORATE CLIENTS"]],
  certs: [["ISO 9001:2015", "QUALITY MANAGEMENT", ""], ["ISO 14001:2015", "ENVIRONMENTAL MANAGEMENT", ""], ["ISO 45001:2018", "OCCUPATIONAL HEALTH & SAFETY", ""]],
  contact: ["+971 50 299 0358", "info@artline-uae.com", "artline-uae.com"],
  words: ["DESIGN", "BUILD", "FURNISH"],
};
const W = 1080, H = 1920, BEAT = 15;
const C = { black: "#000000", white: "#FFFFFF", dark: "#4D4D4D", mid: "#808080", light: "#D9D9D9", maroon: "#800000" };
// 31.5 s: every section held long enough to read (all boundaries on the 120 BPM grid)
const T = { logo: 0, words: 75, cats: 165, per: 90, stats: 615, cert: 735, end: 840, total: 945 };
const EVENTS = []; // [frame, type] consumed by audio.py for sound design

const cv = document.getElementById("c"), x = cv.getContext("2d");
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const P = (f, a, d) => clamp((f - a) / d);
const outExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const inOutExpo = t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2;
const outCubic = t => 1 - Math.pow(1 - t, 3);
const inOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const inCubic = t => t * t * t;
const outBack = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const lerp = (a, b, t) => a + (b - a) * t;

// ---- assets
const IMG = {};
const load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.src = src; });
const GRAIN = [];
window.ready = (async () => {
  await Promise.all([
    load("logo", "../../artline-img/logo-full-white.png"), load("eiac", "assets/eiac.png"),
    ...CONFIG.categories.flatMap(c => c[2]).map(p => load(p[0], "assets/" + p[0] + ".jpg")),
    document.fonts.load("700 100px Barlow"), document.fonts.load("600 100px Barlow"),
    document.fonts.load("500 40px Plex"), document.fonts.load("400 40px Sans"),
  ]);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let k = 0; k < 4; k++) { // deterministic film grain
    const g = document.createElement("canvas"); g.width = 540; g.height = 960; const gx = g.getContext("2d");
    const id = gx.createImageData(540, 960);
    for (let i = 0; i < id.data.length; i += 4) { const v = rnd() * 255; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255; }
    gx.putImageData(id, 0, 0); GRAIN.push(g);
  }
  return true;
})();
const off = document.createElement("canvas"); off.width = W; off.height = H; const ox = off.getContext("2d");

// ---- helpers
function strokePath(ctx, pts, amt) {
  let total = 0; for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
  let left = total * amt; ctx.beginPath(); ctx.moveTo(...pts[0]);
  for (let i = 1; i < pts.length && left > 0; i++) {
    const [ax, ay] = pts[i-1], [bx, by] = pts[i], L = Math.hypot(bx - ax, by - ay), k = Math.min(1, left / L);
    ctx.lineTo(ax + (bx - ax) * k, ay + (by - ay) * k); left -= L;
  }
  ctx.stroke();
}
function font(w, s, fam, ctx = x) { ctx.font = `${w} ${s}px ${fam}`; }
function cover(img, X, Y, w, h, zoom, panY = 0) {
  const r = Math.max(w / img.width, h / img.height) * zoom, iw = img.width * r, ih = img.height * r;
  x.drawImage(img, X + (w - iw) / 2, Y + (h - ih) / 2 + panY, iw, ih);
}
function lettersIn(str, X, Y, lt, start, per, dur, rise, exitT = 1e9) { // masked per-letter rise in, rise out on exit
  let cx = X;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i], w = x.measureText(ch).width;
    const pin = outExpo(P(lt, start + i * per, dur)), pout = inCubic(P(lt, exitT + i * per * 0.5, 6));
    if (pin > 0 && pout < 1) {
      x.save(); x.beginPath(); x.rect(cx - 6, Y - rise * 1.05, w + 12, rise * 1.25); x.clip();
      x.fillText(ch, cx, Y + (1 - pin) * rise - pout * rise); x.restore();
    }
    cx += w;
  }
}
function grain(f) { x.save(); x.globalAlpha = 0.055; x.globalCompositeOperation = "overlay"; x.drawImage(GRAIN[f % 4], 0, 0, W, H); x.restore(); }

// ---- logo geometry (unit square, measured from the official PNG)
const LC = 0.017, LR = 0.981, LB = 0.983, LT = 0.031;
const LOGO_PATHS = [
  [[0.397, LC], [LC, LC], [LC, 0.51]],
  [[LC, 0.63], [LC, LB], [0.436, LB]],
  [[0.549, LB], [LR, LB], [LR, LC], [0.595, LC]],
  [[0.61, LC], [0.61, 0.246]],
  [[LR, 0.448], [0.712, 0.448]],
  [[0.261, 0.031], [0.038, 0.28]],
];
const PLAN_EXTRA = [ // extra walls that make it read as a floor plan, then retract
  [[LC, 0.30], [0.36, 0.30]], [[0.36, 0.30], [0.36, 0.51]], [[0.712, 0.448], [0.712, 0.80]], [[0.30, 0.80], [0.712, 0.80]],
];
const ROOMS = [["RECEPTION", 0.22, 0.43], ["OFFICE", 0.80, 0.25], ["SHOWROOM", 0.40, 0.68], ["STORE", 0.86, 0.66]];
function logoVector(cx, cy, S, amt, width, extra, ctx = x) {
  const o = [cx - S / 2, cy - S / 2], m = ([u, v]) => [o[0] + u * S, o[1] + v * S];
  ctx.strokeStyle = C.white; ctx.lineCap = "butt"; ctx.lineJoin = "miter"; ctx.lineWidth = width;
  LOGO_PATHS.forEach((p, i) => { const a = outCubic(clamp(amt * 1.6 - i * 0.12)); if (a > 0) strokePath(ctx, p.map(m), a); });
  const arcA = outCubic(clamp(amt * 1.6 - 0.75));
  if (arcA > 0) { ctx.save(); ctx.lineWidth = Math.max(3, width * 0.32); ctx.setLineDash([S * 0.024, S * 0.018]);
    ctx.beginPath(); ctx.arc(o[0] + 0.595 * S, o[1] + 0.025 * S, 0.209 * S, Math.PI, Math.PI - Math.PI / 2 * arcA, true); ctx.stroke(); ctx.restore(); }
  if (extra > 0) {
    ctx.save(); ctx.globalAlpha *= extra; ctx.lineWidth = 3; ctx.strokeStyle = C.mid;
    PLAN_EXTRA.forEach((p, i) => { const a = outCubic(clamp(amt * 1.4 - 0.3 - i * 0.08)); if (a > 0) strokePath(ctx, p.map(m), a); });
    font(500, 22, "Plex", ctx); ctx.fillStyle = C.mid; ctx.textAlign = "center";
    ROOMS.forEach(([n, u, v], i) => { if (amt > 0.55 + i * 0.05) { const [X, Y] = m([u, v]); ctx.fillText(n, X, Y); } });
    // dimension line
    const d = clamp(amt * 1.5 - 0.5);
    if (d > 0) { const y = o[1] + S + 46; ctx.beginPath(); ctx.moveTo(o[0], y); ctx.lineTo(o[0] + S * d, y);
      ctx.moveTo(o[0], y - 14); ctx.lineTo(o[0], y + 14); if (d >= 1) { ctx.moveTo(o[0] + S, y - 14); ctx.lineTo(o[0] + S, y + 14); } ctx.stroke();
      ctx.fillStyle = C.light; font(500, 28, "Plex", ctx); ctx.fillText("12.40 m", o[0] + S / 2, y + 50); }
    ctx.textAlign = "left"; ctx.restore();
  }
}
function logoRaster(cx, cy, S, alpha = 1, blur = 0) {
  x.save(); x.globalAlpha = alpha; if (blur > 0.3) x.filter = `blur(${blur}px)`;
  x.drawImage(IMG.logo, cx - S / 2, cy - S / 2, S, S); x.restore();
}
function logoTextReveal(cx, cy, S, wipe, blur) { // the lettering appears through a left-to-right wipe, bars stay vector
  ox.clearRect(0, 0, W, H); ox.save(); if (blur > 0.3) ox.filter = `blur(${blur}px)`;
  ox.drawImage(IMG.logo, cx - S / 2, cy - S / 2, S, S); ox.restore();
  ox.save(); ox.globalCompositeOperation = "destination-in"; ox.fillStyle = "#fff";
  ox.fillRect(cx - S * 0.42, cy - S * 0.2, S * 0.84 * wipe, S * 0.62); ox.restore();
  x.drawImage(off, 0, 0);
}

// ---- scene 1: a line becomes a plan, the plan tightens into the logo (0-75)
function sceneLogo(f) {
  const cx = 540, cy = 860;
  const shoot = outExpo(P(f, 0, 8)), land = inOutExpo(P(f, 7, 9));
  if (land < 1) { // maroon line flies across, then snaps onto the plan's top wall
    const S = 780, y = lerp(cy, cy - S / 2 + LC * S, land), x0 = lerp(-60, cx - S / 2 + LC * S, land), x1 = lerp(lerp(-60, W + 60, shoot), cx - S / 2 + 0.397 * S, land);
    x.strokeStyle = C.maroon; x.lineWidth = 6; x.beginPath(); x.moveTo(x0, y); x.lineTo(x1, y); x.stroke();
  }
  const draw = P(f, 10, 26), tighten = inOutExpo(P(f, 38, 16));
  const S = lerp(780, 500, tighten), width = lerp(4, LT * 500, inOutCubic(P(f, 40, 14)));
  const rot = (1 - outCubic(P(f, 8, 34))) * -0.05, push = 1 + 0.06 * outCubic(P(f, 8, 30)) * (1 - tighten);
  x.save(); x.translate(cx, cy); x.rotate(rot * (1 - tighten)); x.scale(push, push); x.translate(-cx, -cy);
  logoVector(cx, cy, S, draw, width, 1 - P(f, 36, 8));
  x.restore();
  // lettering resolves inside the finished frame
  const w = outExpo(P(f, 50, 12));
  if (w > 0) logoTextReveal(cx, cy, S, w, (1 - w) * 10);
}

// ---- scene 2: DESIGN. BUILD. FURNISH. ONE TEAM. (75-135); logo docks into the header
function headerLogo(f) { // logo position shared by scenes 2-4
  const d = inOutExpo(P(f, T.words, 8));
  return { cx: lerp(540, 140, d), cy: lerp(860, 225, d), S: lerp(500, 140, d) };
}
function drawLogoAt(L, f) {
  if (L.S > 300) { logoVector(L.cx, L.cy, L.S, 1, LT * L.S, 0); logoTextReveal(L.cx, L.cy, L.S, 1, 0); }
  else logoRaster(L.cx, L.cy, L.S);
}
function sceneWords(f) {
  const t = f - T.words;
  const exit = inOutExpo(P(t, 80, 10)) * -1500;
  x.save(); x.translate(0, exit);
  font(700, 250, "Barlow");
  CONFIG.words.forEach((w, i) => {
    const f0 = 8 + i * BEAT, p = P(t, f0, 10); if (p <= 0) return;
    const y = 760 + i * 235, k = outBack(p, 2.2), sc = lerp(1.3, 1, outCubic(p));
    const blur = p < 0.35 ? (1 - p / 0.35) * 14 : 0;
    x.save(); if (blur > 0.3) x.filter = `blur(${blur}px)`; x.translate(80, y + (1 - k) * 280); x.scale(sc, sc);
    x.fillStyle = C.white; x.fillText(w, 0, 0); x.fillStyle = C.maroon; x.fillText(".", x.measureText(w).width, 0); x.restore();
  });
  const b = outExpo(P(t, 3 * BEAT + 4, 8));
  if (b > 0) {
    font(700, 130, "Barlow"); const tw = x.measureText("ONE TEAM.").width + 60;
    x.fillStyle = C.maroon; x.fillRect(60, 1390, tw * b, 160);
    x.save(); x.beginPath(); x.rect(60, 1390, tw * b, 160); x.clip(); x.fillStyle = C.white;
    lettersIn("ONE TEAM.", 90, 1515, t, 3 * BEAT + 7, 0.8, 8, 130); x.restore();
  }
  x.restore();
}

// ---- scene 3: categories, 2-4 projects stacked in one composition each (135-435)
const R = { x: 40, y: 470, w: 1000, h: 1170 };
const LAYOUTS = { // boxes in region units (px inside R) + entry direction per tile
  mosaic4: [[0, 0, 600, 680, "up"], [616, 0, 384, 332, "left"], [616, 348, 384, 332, "left"], [0, 696, 1000, 474, "right"]],
  hero3: [[0, 0, 1000, 630, "down"], [0, 646, 492, 524, "right"], [508, 646, 492, 524, "left"]],
  bands2: [[0, 0, 1000, 577, "right"], [0, 593, 1000, 577, "left"]],
  cols3: [[0, 0, 328, 1170, "up"], [336, 0, 328, 1170, "down"], [672, 0, 328, 1170, "up"]],
  offset2: [[0, 0, 1000, 730, "down"], [180, 746, 820, 424, "left"]],
};
const ENTER = (j) => 6 + j * 7, EXIT = (j) => T.per - 9 + j * 1.5;
function tile(img, label, box, lt, j, dimAll) {
  const [bx, by, bw, bh, dir] = box, X = R.x + bx, Y = R.y + by;
  const e = outExpo(P(lt, ENTER(j), 13)), q = inOutExpo(P(lt, EXIT(j), 9));
  if (e <= 0 || q >= 1) return;
  const ty = -q * 1500, vy = q > 0 && q < 1 ? -170 : 0;
  // reveal mask grows from the entry side; the photo travels the other way (parallax)
  let cx = X, cy = Y, cw = bw, ch = bh, px = 0, py = 0;
  if (dir === "left") { cw = bw * e; px = (1 - e) * 160; }
  if (dir === "right") { cx = X + bw * (1 - e); cw = bw * e; px = -(1 - e) * 160; }
  if (dir === "up") { cy = Y + bh * (1 - e); ch = bh * e; py = -(1 - e) * 200; }
  if (dir === "down") { ch = bh * e; py = (1 - e) * 200; }
  const drift = (lt / T.per) * (j % 2 ? -26 : 26), zoom = 1.16 - 0.1 * e + 0.04 * (lt / T.per);
  const ghosts = vy ? 4 : 0;
  for (let g = ghosts; g >= 0; g--) {
    x.save(); x.globalAlpha = g ? 0.18 : 1; x.translate(0, ty - vy * g * 0.25);
    x.beginPath(); x.rect(cx, cy, cw, ch); x.clip();
    const r = Math.max(bw / img.width, bh / img.height) * zoom, iw = img.width * r, ih = img.height * r;
    const isCol = bw < bh;
    x.drawImage(img, X + (bw - iw) / 2 + px + (isCol ? 0 : drift), Y + (bh - ih) / 2 + py + (isCol ? drift * 2 : 0), iw, ih);
    if (dimAll) { x.fillStyle = C.black; x.globalAlpha = (g ? 0.18 : 1) * dimAll; x.fillRect(X, Y, bw, bh); }
    x.restore();
  }
  // project tag: black chip, maroon bullet, typed label
  const tg = P(lt, ENTER(j) + 8, 1);
  if (tg > 0 && !dimAll) {
    x.save(); x.translate(0, ty); font(500, 24, "Plex");
    const n = Math.floor(clamp((lt - ENTER(j) - 8) / 0.5, 0, label.length)), s = label.slice(0, n), tw = x.measureText(label).width;
    x.fillStyle = "rgba(0,0,0,.78)"; x.fillRect(X + 16, Y + bh - 60, Math.min(tw, x.measureText(s).width) + 50, 44);
    x.fillStyle = C.maroon; x.fillRect(X + 28, Y + bh - 44, 12, 12);
    x.fillStyle = C.white; x.fillText(s, X + 52, Y + bh - 29); x.restore();
  }
}
function drawCat(ci, lt, dimAll = 0) {
  const [name, layout, tiles] = CONFIG.categories[ci];
  LAYOUTS[layout].forEach((box, j) => tile(IMG[tiles[j][0]], tiles[j][1], box, lt, j, dimAll));
}
function sceneCats(f) {
  const t = f - T.cats, n = CONFIG.categories.length;
  const ci = clamp(Math.floor(t / T.per), 0, n - 1), lt = t - ci * T.per;
  const [name, , tiles] = CONFIG.categories[ci];
  drawCat(ci, lt);
  // category title: letters rise in, rise out with the tiles
  font(700, 132, "Barlow"); const fs = Math.min(132, 132 * 960 / x.measureText(name).width);
  font(700, fs, "Barlow"); x.fillStyle = C.white;
  lettersIn(name, 56, 438, lt, 0, 0.7, 9, fs * 0.95, T.per - 10);
  // story-style progress segments
  for (let i = 0; i < n; i++) {
    const sx = 40 + i * 202, fill = i < ci ? 1 : i > ci ? 0 : clamp(lt / T.per);
    x.fillStyle = C.dark; x.fillRect(sx, 1700, 186, 4); x.fillStyle = C.maroon; x.fillRect(sx, 1700, 186 * fill, 4);
  }
}

// ---- scene 4: odometer numbers over the dimmed strip (315-375)
function sceneStats(f) {
  const t = f - T.stats;
  drawCat(CONFIG.categories.length - 1, T.per - 12, 0.85);
  const seg = 40, i = clamp(Math.floor(t / seg), 0, 2), lt = t - i * seg;
  const roll = i > 0 ? outExpo(P(lt, 0, 9)) : outExpo(P(t, 0, 10));
  font(700, 520, "Barlow"); x.textAlign = "center"; x.fillStyle = C.white;
  x.save(); x.beginPath(); x.rect(0, 460, W, 560); x.clip();
  if (i > 0 && roll < 1) x.fillText(CONFIG.stats[i - 1][0], 540, 940 - roll * 560);
  x.fillText(CONFIG.stats[i][0], 540, 940 + (1 - roll) * 560);
  x.restore();
  x.fillStyle = C.maroon; x.fillRect(540 - 90 * roll, 1000, 180 * roll, 10);
  font(600, 56, "Barlow"); x.fillStyle = C.light; x.globalAlpha = outCubic(P(lt, 3, 8));
  x.fillText(CONFIG.stats[i][1], 540, 1110); x.globalAlpha = 1;
  x.textAlign = "left";
}

// ---- scene 5: logo returns to centre, contact, CTA (375-450)
// ---- scene 5: ISO certificates + EIAC accreditation (735-840)
function sceneCert(f) {
  const t = f - T.cert, out = inOutExpo(P(t, 96, 9)) * -1600;
  x.save(); x.translate(0, out);
  font(500, 28, "Plex"); x.fillStyle = C.light;
  const kick = "ISO CERTIFIED · EIAC ACCREDITED", nk = Math.floor(clamp((t - 2) / 0.5, 0, kick.length));
  x.fillText(kick.slice(0, nk), 60, 330);
  x.fillStyle = C.maroon; x.fillRect(60, 348, 70 * outExpo(P(t, 2, 10)), 6);
  font(700, 132, "Barlow"); x.fillStyle = C.white; lettersIn("CERTIFIED", 56, 500, t, 4, 0.8, 9, 125);
  CONFIG.certs.forEach(([std, name, no], i) => {
    const f0 = 12 + i * BEAT, Y = 560 + i * 230, X = 60, w = 960, h = 200;
    const o = outCubic(P(t, f0, 10)), c = outExpo(P(t, f0 + 4, 10));
    if (o <= 0) return;
    x.strokeStyle = C.dark; x.lineWidth = 3; strokePath(x, [[X, Y], [X + w, Y], [X + w, Y + h], [X, Y + h], [X, Y]], o);
    x.fillStyle = C.maroon; x.fillRect(X, Y, 10, h * c);
    x.save(); x.beginPath(); x.rect(X, Y, w, h); x.clip(); x.globalAlpha = c;
    font(700, 92, "Barlow"); x.fillStyle = C.white; x.fillText(std, X + 44, Y + 100 + (1 - c) * 60);
    font(600, 40, "Barlow"); x.fillStyle = C.light; x.fillText(name, X + 46, Y + 150 + (1 - c) * 60);
    if (no) { font(500, 24, "Plex"); x.fillStyle = C.mid; x.textAlign = "right"; x.fillText("CERT. " + no, X + w - 30, Y + 150 + (1 - c) * 60); x.textAlign = "left"; }
    x.restore();
  });
  // EIAC accreditation plate stamps in
  const s = P(t, 58, 10);
  if (s > 0) {
    const k = outBack(s, 2.4), pw = 960, ph = 330, px = 60, py = 1270;
    x.save(); x.globalAlpha = clamp(s * 3); x.translate(540, py + ph / 2); x.scale(lerp(1.25, 1, k), lerp(1.25, 1, k)); x.translate(-540, -(py + ph / 2));
    x.fillStyle = C.white; x.fillRect(px, py, pw, ph);
    const iw = 880, ih = iw * IMG.eiac.height / IMG.eiac.width; x.drawImage(IMG.eiac, 540 - iw / 2, py + (ph - ih) / 2, iw, ih);
    x.restore();
    font(400, 34, "Sans"); x.fillStyle = C.light; x.globalAlpha = outCubic(P(t, 68, 10)); x.textAlign = "center";
    x.fillText("Certified by VSQC, accredited by the Emirates", 540, 1665);
    x.fillText("International Accreditation Centre (EIAC)", 540, 1712); x.textAlign = "left"; x.globalAlpha = 1;
  }
  x.restore();
}

function sceneEnd(f) {
  const t = f - T.end;
  
  const d = inOutExpo(P(t, 0, 14));
  const L = { cx: lerp(140, 540, d), cy: lerp(225, 700, d), S: lerp(140, 470, d) };
  if (d < 1) logoRaster(L.cx, L.cy, L.S); else { logoVector(L.cx, L.cy, L.S, 1, LT * L.S, 0); logoTextReveal(L.cx, L.cy, L.S, 1, 0); }
  font(600, 50, "Barlow"); x.textAlign = "center"; x.fillStyle = C.white;
  lettersCenter("DESIGNED, BUILT AND FURNISHED BY ONE TEAM.", 540, 1040, t, 14);
  font(500, 40, "Plex");
  CONFIG.contact.forEach((ln, k) => { const p = outExpo(P(t, 22 + k * 3, 10)); x.globalAlpha = p; x.fillStyle = C.light; x.fillText(ln, 540, 1150 + k * 66 + (1 - p) * 30); });
  x.globalAlpha = 1;
  const bw = 640, bh = 116, bx = 540 - bw / 2, by = 1390, o = outCubic(P(t, 32, 8)), fl = outExpo(P(t, 39, 8));
  x.strokeStyle = C.white; x.lineWidth = 3; if (o > 0) strokePath(x, [[bx, by], [bx + bw, by], [bx + bw, by + bh], [bx, by + bh], [bx, by]], o);
  if (fl > 0) { x.fillStyle = C.maroon; x.fillRect(bx, by, bw * fl, bh); font(700, 58, "Barlow"); x.fillStyle = C.white; x.globalAlpha = fl; x.fillText("REQUEST A SITE VISIT", 540, by + 80); x.globalAlpha = 1; }
  x.textAlign = "left";
}
function lettersCenter(s, cx, y, t, start) { // whole line rises through a mask
  const p = outExpo(P(t, start, 10)); x.save(); x.beginPath(); x.rect(0, y - 60, W, 80); x.clip(); x.fillText(s, cx, y + (1 - p) * 70); x.restore();
}

function draw(f) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.filter = "none"; x.globalAlpha = 1; x.globalCompositeOperation = "source-over";
  x.fillStyle = C.black; x.fillRect(0, 0, W, H); x.textBaseline = "alphabetic"; x.textAlign = "left";
  if (f < T.words) sceneLogo(f);
  else if (f < T.cats) sceneWords(f);
  else if (f < T.stats) sceneCats(f);
  else if (f < T.cert) sceneStats(f);
  else if (f < T.end) sceneCert(f);
  else sceneEnd(f);
  if (f >= T.words && f < T.end) drawLogoAt(headerLogo(f), f);
  grain(f);
}
(() => { // sound design cue sheet (frames)
  const E = (f, k) => EVENTS.push([Math.round(f), k]);
  E(0, "sweep"); E(7, "snap"); E(10, "riser"); E(54, "lock"); E(50, "shimmer");
  E(T.words, "whoosh"); [0, 1, 2].forEach(i => E(T.words + 8 + i * BEAT + 3, "hit")); E(T.words + 3 * BEAT + 5, "bighit");
  E(T.words + 80, "whoosh"); E(T.cats, "drop"); E(T.end, "outro");
  CONFIG.categories.forEach((c, ci) => {
    const s = T.cats + ci * T.per; E(s, "whoosh");
    LAYOUTS[c[1]].forEach((b, j) => { E(s + ENTER(j) + 2, "pop"); E(s + ENTER(j) + 8, "type"); });
    E(s + T.per - 9, "swoosh");
  });
  E(T.stats, "impact"); E(T.stats + 40, "tick"); E(T.stats + 80, "tick");
  E(T.cert, "whoosh"); E(T.cert + 2, "type"); [0, 1, 2].forEach(i => { E(T.cert + 12 + i * BEAT, "pop"); E(T.cert + 16 + i * BEAT, "tick"); }); E(T.cert + 60, "stamp"); E(T.cert + 96, "swoosh");
  E(T.end, "whoosh"); E(T.end + 14, "lock"); E(T.end + 39, "shimmer");
})();
window.draw = draw; window.TOTAL = T.total; window.EVENTS = EVENTS;
